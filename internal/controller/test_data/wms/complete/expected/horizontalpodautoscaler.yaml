---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    pdok.nl/app: mapserver
    dataset: dataset
    dataset-owner: datasetOwner
    pdok.nl/inspire: "true"
    service-type: wms
    service-version: v1_0
    theme: "2016"
  name: complete-wms-mapserver
  namespace: default
  ownerReferences:
    - apiVersion: pdok.nl/v3
      kind: WMS
      name: complete
      uid: ""
      blockOwnerDeletion: true
      controller: true
spec:
  behavior:
    scaleDown:
      policies:
        - periodSeconds: 120
          type: Percent
          value: 25
        - periodSeconds: 120
          type: Pods
          value: 1
      selectPolicy: Max
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
        - periodSeconds: 600
          type: Pods
          value: 20
      selectPolicy: Max
      stabilizationWindowSeconds: 300
  maxReplicas: 50
  metrics:
    - resource:
        name: cpu
        target:
          averageValue: 6
          type: AverageValue
      type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: complete-wms-mapserver
